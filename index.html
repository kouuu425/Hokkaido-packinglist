<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>北海道 Aug 8–11</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #faf8f4;
      --surf:   #ffffff;
      --hero:   #18243c;
      --text:   #1a1f2e;
      --muted:  #9c9790;
      --border: #e8e2d8;
      --blue:   #3a6694;
      --green:  #4a7c5a;
      --amber:  #bf7e38;
      --red:    #bf5044;
      --purple: #4c1d95;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans",
                   "Yu Gothic UI", "Meiryo", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      padding-bottom: calc(100px + env(safe-area-inset-bottom));
    }

    /* ── Splash overlay ── */
    .splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #18243c;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      pointer-events: none;
      animation: splashOut .55s 1.1s cubic-bezier(.4,0,1,1) forwards;
    }

    .splash-snow {
      font-size: 1.1rem;
      color: rgba(255,255,255,.22);
      margin-bottom: 6px;
      animation: splashTextOut .35s .75s ease forwards;
    }

    .splash-label {
      font-size: .58rem;
      font-weight: 800;
      letter-spacing: .32em;
      text-transform: uppercase;
      color: rgba(255,255,255,.3);
      animation: splashTextOut .35s .8s ease forwards;
    }

    .splash-date {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -.03em;
      color: rgba(255,255,255,.6);
      animation: splashTextOut .35s .7s ease forwards;
    }

    @keyframes splashOut {
      from { opacity: 1; transform: scale(1); }
      to   { opacity: 0; transform: scale(1.07); visibility: hidden; }
    }

    @keyframes splashTextOut {
      to { opacity: 0; transform: translateY(-4px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .splash, .splash-snow, .splash-label, .splash-date {
        animation-duration: 1ms !important;
        animation-delay: 0ms !important;
      }
    }

    /* ── Hero ── */
    .hero {
      background: var(--hero);
      color: #fff;
      padding: 10px 18px 0;
      position: relative;
      overflow: hidden;
    }
    .hero-eyebrow { display: none; }
    .hero-title {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -.02em;
      line-height: 1;
      margin-bottom: 3px;
    }
    .hero-title span { font-weight: 300; opacity: .5; }
    .hero-sub {
      font-size: .72rem;
      letter-spacing: .08em;
      opacity: .55;
      margin-bottom: 8px;
    }
    .hero-mtn { display: block; width: 100%; }

    /* ── Sticky section nav ── */
    .sec-nav {
      position: sticky;
      top: 0;
      z-index: 90;
      background: rgba(250,248,244,.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      display: flex;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .sec-nav::-webkit-scrollbar { display: none; }
    .sec-nav a {
      flex: none;
      padding: 11px 18px;
      font-size: .73rem;
      font-weight: 700;
      color: var(--muted);
      text-decoration: none;
      border-bottom: 2px solid transparent;
      letter-spacing: .06em;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
      transition: color .18s, border-color .18s;
    }
    .sec-nav a.active { color: var(--blue); border-bottom-color: var(--blue); }

    /* ── Content wrap ── */
    .wrap { max-width: 600px; margin: 0 auto; padding: 24px 18px 0; }

    section[id] { scroll-margin-top: 42px; }

    /* ── Section heading ── */
    .sec-heading {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .sec-heading h2 {
      font-size: .65rem;
      font-weight: 800;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .sec-heading::after { content: ""; flex: 1; height: 1px; background: var(--border); }

    /* ── Maps button ── */
    .map-btn {
      display: flex; align-items: center; gap: 12px;
      background: var(--surf); border: 1.5px solid var(--border);
      border-radius: 10px; padding: 13px 15px; text-decoration: none;
      color: var(--text); margin-bottom: 18px;
      box-shadow: 0 1px 4px rgba(0,0,0,.04);
      -webkit-tap-highlight-color: transparent; transition: background .12s;
    }
    .map-btn:active { background: #f3ede4; }
    .map-btn .mi { font-size: 1.2rem; }
    .map-btn .mt { font-size: .88rem; font-weight: 700; }
    .map-btn .ms { font-size: .7rem; color: var(--muted); margin-top: 1px; }
    .map-btn .ma { margin-left: auto; color: var(--muted); font-size: .82rem; }

    /* ── Day cards ── */
    .day-card {
      background: var(--surf);
      border-radius: 14px;
      margin-bottom: 14px;
      overflow: hidden;
      box-shadow: 0 1px 5px rgba(0,0,0,.06), 0 0 0 1px var(--border);
    }

    .day-top {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 14px 16px 12px;
    }

    .day-num-col { flex-shrink: 0; text-align: center; }
    .day-num { font-size: 2.6rem; font-weight: 800; color: var(--blue); letter-spacing: -.04em; line-height: 1; }
    .day-card.is-today .day-num { color: var(--amber); }
    .day-wk { font-size: .62rem; font-weight: 700; letter-spacing: .1em; color: var(--muted); margin-top: 2px; }

    .day-meta { flex: 1; padding-top: 5px; }
    .day-month { font-size: .68rem; font-weight: 700; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
    .day-route { font-size: .9rem; font-weight: 600; color: var(--text); margin-top: 2px; line-height: 1.3; }
    .today-tag {
      display: inline-block; background: var(--amber); color: #fff;
      font-size: .6rem; font-weight: 800; letter-spacing: .1em;
      padding: 2px 7px; border-radius: 3px; margin-top: 6px;
    }

    .day-rule { height: 1px; background: var(--border); margin: 0 16px; }
    .day-body { padding: 10px 16px 12px; }

    /* regular activity row */
    .act-row { display: flex; gap: 10px; align-items: flex-start; padding: 5px 0; }
    .act-t { font-size: .72rem; font-weight: 700; color: var(--muted); min-width: 42px; padding-top: 1px; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .act-d { font-size: .88rem; line-height: 1.45; flex: 1; padding-top: 1px; }
    .rsv { display: inline-block; background: #e7f3eb; color: var(--green); font-size: .6rem; font-weight: 800; letter-spacing: .04em; padding: 1px 5px; border-radius: 3px; margin-left: 4px; vertical-align: 1px; }

    /* flight row (embedded in day card) */
    .act-flight .act-d { padding-top: 0; }

    .flt-block {
      background: #f5f2ec;
      border-radius: 8px;
      padding: 9px 11px;
    }

    .flt-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .flt-ap { font-size: 1rem; font-weight: 900; letter-spacing: .02em; }
    .flt-dots { flex: 1; text-align: center; font-size: .65rem; letter-spacing: .18em; color: var(--muted); }
    .flt-arr { font-weight: 700; font-size: .82rem; color: var(--muted); white-space: nowrap; }

    .flt-sub { font-size: .68rem; color: var(--muted); margin-top: 5px; line-height: 1.4; }
    .flt-no { font-weight: 800; color: var(--text); }

    .bag-note {
      display: inline-block;
      margin-top: 6px;
      font-size: .68rem;
      color: #855b1a;
      background: #fef3d8;
      border-radius: 4px;
      padding: 3px 8px;
      line-height: 1.4;
    }

    .day-links { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 16px 12px; }
    .pill {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 6px 12px; border-radius: 99px;
      border: 1.5px solid var(--border); background: var(--bg);
      color: var(--text); font-size: .8rem; font-weight: 600;
      text-decoration: none; -webkit-tap-highlight-color: transparent;
      transition: background .12s;
    }
    .pill:active { background: #eee8de; }
    .pill.map { color: var(--green); border-color: #b4d4be; background: #f0f8f2; }
    .pill.map:active { background: #d6ecdf; }

    /* ── Section divider ── */
    .sec-sep { height: 8px; background: var(--border); opacity: .4; margin: 8px 0; }

    /* ── Packing ── */
    .prog-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .prog-lbl { font-size: .7rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
    .prog-pct { font-size: .78rem; font-weight: 800; color: var(--blue); }
    .prog-track { height: 3px; background: var(--border); border-radius: 99px; overflow: hidden; margin-bottom: 22px; }
    .prog-fill { height: 100%; background: var(--blue); border-radius: 99px; width: 0%; transition: width .3s ease; }

    .cat-hd {
      display: flex; align-items: center; gap: 8px;
      padding: 18px 0 8px; cursor: pointer; user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .cat-icon { font-size: .95rem; }
    .cat-name { font-size: .7rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
    .cat-rule { flex: 1; height: 1px; background: var(--border); }
    .cat-cnt { font-size: .7rem; font-weight: 800; color: var(--blue); }
    .cat-cnt.done { color: var(--green); }
    .cat-chev { font-size: .64rem; color: var(--muted); transition: transform .18s; }

    .item-list { list-style: none; }
    .item {
      display: flex; align-items: center; gap: 11px;
      padding: 11px 0; border-bottom: 1px solid var(--border);
      cursor: pointer; -webkit-tap-highlight-color: transparent;
      transition: opacity .1s;
    }
    .item:last-child { border-bottom: none; }
    .item:active { opacity: .55; }

    .chk {
      width: 22px; height: 22px; border-radius: 6px;
      border: 1.5px solid #ccc7be; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: all .12s;
    }
    .item.checked .chk { background: var(--blue); border-color: var(--blue); }
    .chk-mark { display: none; color: #fff; font-size: .75rem; font-weight: 900; }
    .item.checked .chk-mark { display: block; }

    .item-lbl { font-size: .9rem; line-height: 1.4; flex: 1; }
    .item.checked .item-lbl { text-decoration: line-through; color: #bbb6ae; }

    .del-btn {
      width: 26px; height: 26px; border-radius: 50%;
      border: 1.5px solid #d8d2c8; background: none; color: #c8c2b8;
      font-size: .8rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: all .12s;
      -webkit-tap-highlight-color: transparent;
    }
    .del-btn:active { background: var(--red); border-color: var(--red); color: #fff; }

    .add-inline { padding: 7px 0 4px; }
    .add-wrap { display: flex; align-items: center; gap: 7px; }
    .add-field {
      flex: 1; padding: 8px 11px;
      border: 1.5px dashed #d0cab8; border-radius: 8px;
      font-size: .86rem; font-family: inherit;
      color: var(--text); background: transparent; outline: none;
      transition: border-color .15s, background .15s, border-style .1s;
    }
    .add-field::placeholder { color: #c5bfb3; }
    .add-field:focus { border-style: solid; border-color: var(--blue); background: var(--surf); }
    .add-submit {
      width: 30px; height: 30px; border-radius: 50%;
      background: var(--blue); color: #fff; border: none;
      font-size: 1.1rem; font-family: inherit; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; opacity: 0; transition: opacity .15s; pointer-events: none;
    }
    .add-wrap:focus-within .add-submit { opacity: 1; pointer-events: auto; }
    .add-submit:active { opacity: .7; }

    .pack-footer { padding: 20px 0 8px; display: flex; flex-direction: column; gap: 8px; }
    .txt-btn {
      padding: 11px; font-size: .82rem; font-weight: 700; font-family: inherit;
      background: none; border: 1px solid var(--border); border-radius: 8px;
      color: var(--muted); cursor: pointer; -webkit-tap-highlight-color: transparent;
      transition: background .12s;
    }
    .txt-btn:active { background: #f0ebe3; }
    .txt-btn.danger { color: var(--red); border-color: #e4c4be; }

    /* ── SUP detail ── */
    .sup-card {
      background: var(--surf);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 1px 5px rgba(0,0,0,.06), 0 0 0 1px var(--border);
    }
    .sup-title { padding: 13px 16px 11px; border-bottom: 1px solid var(--border); font-size: .95rem; font-weight: 800; }
    .det-row { display: flex; gap: 12px; padding: 9px 16px; border-bottom: 1px solid var(--border); align-items: flex-start; }
    .det-row:last-child { border-bottom: none; }
    .det-k { font-size: .68rem; font-weight: 700; letter-spacing: .06em; color: var(--muted); min-width: 52px; padding-top: 1px; white-space: nowrap; }
    .det-v { font-size: .86rem; color: var(--text); flex: 1; line-height: 1.45; }

    /* ── Walica FAB ── */
    .walica-fab {
      position: fixed;
      bottom: calc(22px + env(safe-area-inset-bottom));
      right: 18px;
      z-index: 200;
      display: flex;
      align-items: center;
      gap: 8px;
      height: 52px;
      padding: 0 22px 0 18px;
      border-radius: 99px;
      background: var(--purple);
      color: #fff;
      text-decoration: none;
      font-size: .9rem;
      font-weight: 800;
      font-family: inherit;
      letter-spacing: .02em;
      box-shadow: 0 4px 20px rgba(76,29,149,.45), 0 1px 6px rgba(0,0,0,.18);
      -webkit-tap-highlight-color: transparent;
      transition: transform .15s cubic-bezier(.22,1,.36,1), box-shadow .15s;
      user-select: none;
      cursor: pointer;
    }
    .walica-fab:active {
      transform: scale(.93);
      box-shadow: 0 2px 10px rgba(76,29,149,.35);
    }
    .walica-fab .wf-i { font-size: 1.1rem; }
  </style>
</head>
<body>

<div class="splash">
  <span class="splash-snow">❄</span>
  <span class="splash-date">Aug 8–11</span>
  <span class="splash-label">Hokkaido 2026</span>
</div>

<!-- Hero -->
<header class="hero">
  <p class="hero-eyebrow">❄ HOKKAIDO TRIP 2026</p>
  <h1 class="hero-title">Aug 8 <span>– 11</span></h1>
  <p class="hero-sub">札幌 · 洞爺湖 · 3泊4日</p>
  <svg class="hero-mtn" viewBox="0 0 375 36" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0,36 L48,13 L88,22 L138,4 L192,20 L244,8 L292,19 L336,10 L375,15 L375,36 Z" fill="rgba(255,255,255,0.04)"/>
    <path d="M0,36 L32,25 L78,30 L124,16 L174,27 L226,15 L278,25 L325,19 L375,23 L375,36 Z" fill="rgba(255,255,255,0.07)"/>
    <path d="M0,36 L0,32 Q60,28 120,30 Q180,32 240,29 Q300,26 375,30 L375,36 Z" fill="#faf8f4"/>
  </svg>
</header>

<!-- Sticky section nav -->
<nav class="sec-nav">
  <a href="#s-itinerary" class="active">旅程 &amp; フライト</a>
  <a href="#s-packing">持ち物</a>
</nav>

<!-- ═══ 旅程 & フライト ═══ -->
<section id="s-itinerary">
  <div class="wrap">
    <div class="sec-heading"><h2>旅程 &amp; フライト</h2></div>

    <a class="map-btn" href="https://maps.app.goo.gl/g3pKnpq2W5jzeUaJ9?g_st=i" target="_blank" rel="noopener">
      <span class="mi">📍</span>
      <div><div class="mt">ほっかいどう · Ko</div><div class="ms">立ち寄りスポット一覧 (Googleマップ)</div></div>
      <span class="ma">↗</span>
    </a>

    <div id="itinerary-cards"></div>
  </div>
</section>

<!-- ═══ 持ち物 ═══ -->
<section id="s-packing">
  <div class="sec-sep"></div>
  <div class="wrap">
    <div class="sec-heading" id="packToggle" style="cursor:pointer;-webkit-tap-highlight-color:transparent;">
      <h2>持ち物リスト</h2>
      <span class="prog-pct" id="progressPct" style="font-size:.7rem;font-weight:800;color:var(--blue);margin-right:4px;">0%</span>
      <span id="packChev" style="font-size:.65rem;color:var(--muted);transition:transform .18s;">▾</span>
    </div>
    <div id="pack-body">
      <div class="prog-track" style="margin-top:-8px;"><div class="prog-fill" id="progressFill"></div></div>
      <div id="pack-main"></div>
      <div class="pack-footer">
        <button class="txt-btn danger" id="resetBtn">チェックをすべてリセット</button>
        <button class="txt-btn" id="restoreBtn">デフォルトの項目に戻す</button>
      </div>
    </div>
  </div>
</section>


<!-- Walica FAB -->
<a class="walica-fab" href="https://walica.jp/group/01KXQ9M1WV2M9Q1WV98JN369C1" target="_blank" rel="noopener noreferrer">
  <span class="wf-i">💰</span>
  Walica
</a>

<script>
/* ── Section nav active tracking ── */
const navLinks = document.querySelectorAll(".sec-nav a");
const sections = document.querySelectorAll("section[id]");

function updateNav() {
  const threshold = 52;
  let current = sections[0].id;
  sections.forEach(s => {
    if (s.getBoundingClientRect().top <= threshold) current = s.id;
  });
  navLinks.forEach(a => a.classList.toggle("active", a.getAttribute("href") === "#" + current));
}

window.addEventListener("scroll", updateNav, { passive: true });
updateNav();

/* ── Itinerary (flights embedded) ── */
const DAYS = [
  {
    date: "2026-08-08", num: "8", wk: "SAT", month: "Aug",
    route: "東京 → 新千歳 → 札幌",
    acts: [
      {
        t: "16:50",
        flight: { from: "NRT", to: "CTS", arr: "18:35", no: "IJ835", airline: "Spring Airlines Japan", dur: "1h 45m", cls: "エコノミー" },
        baggage: true,
      },
      { t: "夜", d: "札幌で飲み 🍻" },
    ],
    links: [{ label: "🏠 宿 (Airbnb・札幌)", url: "https://www.airbnb.com/l/ohH70mvu" }, { label: "📍 地図", url: "https://maps.app.goo.gl/H9NTrrZR1b4mPbg17?g_st=ic", cls: "map" }],
  },
  {
    date: "2026-08-09", num: "9", wk: "SUN", month: "Aug",
    route: "札幌 → 洞爺湖",
    acts: [
      { t: "9:00",  d: "レンタカー出発（トヨタレンタカー札幌駅前店）", rsv: true, mapUrl: "https://maps.app.goo.gl/jnTwAcMAEVok9Pqt7?g_st=il" },
      { t: "14:20", d: "洞爺湖SUP 集合 / 14:30 開始（K-LABO）🏄", rsv: true, mapUrl: "https://maps.app.goo.gl/NGKSJWPosJmZbVPE6?g_st=ic" },
    ],
    links: [{ label: "🏠 宿 (Airbnb・洞爺湖)", url: "https://www.airbnb.com/l/FKQr6pWi" }, { label: "📍 地図", url: "https://maps.app.goo.gl/yPDwWDrjoAmwftwY6?g_st=ic", cls: "map" }],
  },
  {
    date: "2026-08-10", num: "10", wk: "MON", month: "Aug",
    route: "室蘭・登別・苫小牧 → 札幌",
    acts: [
      { t: "日中",  d: "室蘭・登別・苫小牧 観光 🗺️" },
      { t: "19:30", d: "サッポロビール園 🍺", rsv: true },
    ],
    links: [{ label: "🏠 宿 (Airbnb・札幌)", url: "https://www.airbnb.com/l/h5kebnru" }, { label: "📍 地図", url: "https://maps.app.goo.gl/9KQUfaAMn2zPWhdJ8?g_st=ic", cls: "map" }],
  },
  {
    date: "2026-08-11", num: "11", wk: "TUE", month: "Aug",
    route: "新千歳 → 東京",
    acts: [
      { t: "〜12:15", d: "新千歳空港へ移動" },
      {
        t: "11:25",
        flight: { from: "CTS", to: "NRT", arr: "13:05", no: "GK126", airline: "Jetstar Japan", dur: "1h 40m", cls: "エコノミー" },
        baggage: true,
      },
    ],
    links: [],
  },
];

function renderAct(a) {
  if (a.flight) {
    const f = a.flight;
    const bag = a.baggage
      ? `<div class="bag-note">⚠ 機内持ち込み: 23×36×56cm 以内 · 5kg 以内</div>`
      : "";
    return `
      <div class="act-row act-flight">
        <span class="act-t">${a.t}</span>
        <div class="act-d">
          <div class="flt-block">
            <div class="flt-row">
              <span class="flt-ap">${f.from}</span>
              <span class="flt-dots">· · ✈ · ·</span>
              <span class="flt-ap">${f.to}</span>
              <span class="flt-arr">→ ${f.arr}</span>
            </div>
            <div class="flt-sub"><span class="flt-no">${f.no}</span> · ${f.airline} · ${f.dur} · ${f.cls}</div>
          </div>
          ${bag}
        </div>
      </div>`;
  }
  const rsvBadge = a.rsv ? '<span class="rsv">予約済</span>' : "";
  const map = a.mapUrl
    ? `<div style="margin-top:5px"><a href="${a.mapUrl}" target="_blank" rel="noopener" class="pill map">📍 地図</a></div>`
    : "";
  return `
    <div class="act-row">
      <span class="act-t">${a.t}</span>
      <div class="act-d">${a.d}${rsvBadge}${map}</div>
    </div>`;
}

(function buildItinerary() {
  const today = new Date().toISOString().slice(0, 10);
  const wrap = document.getElementById("itinerary-cards");
  DAYS.forEach((day, i) => {
    const isToday = day.date === today;
    const card = document.createElement("div");
    card.className = "day-card" + (isToday ? " is-today" : "");

    const linksHtml = day.links.length
      ? `<div class="day-links">${day.links.map(l => `<a href="${l.url}" target="_blank" rel="noopener" class="pill${l.cls ? " " + l.cls : ""}">${l.label}</a>`).join("")}</div>`
      : "";

    card.innerHTML = `
      <div class="day-top">
        <div class="day-num-col">
          <div class="day-num">${day.num}</div>
          <div class="day-wk">${day.wk}</div>
        </div>
        <div class="day-meta">
          <div class="day-month">${day.month}</div>
          <div class="day-route">${day.route}</div>
          ${isToday ? '<span class="today-tag">Today</span>' : ""}
        </div>
      </div>
      <div class="day-rule"></div>
      <div class="day-body">${day.acts.map(renderAct).join("")}</div>
      ${linksHtml}`;

    wrap.appendChild(card);
  });
})();

/* ── Packing list ── */
const DEFAULTS = [
  { id: "clothes",     icon: "👕", name: "衣類",        items: ["3日分の下着","3日分の洋服","スポーツ用シャツ（2枚）","パジャマ","羽織りもの（朝晩冷える対策）","水着","ラッシュガード","濡れてもいい服 / 着替え（SUP用）","歩きやすい靴（観光用）","サンダル / マリンシューズ","帽子","サングラス"] },
  { id: "toiletry",    icon: "🧴", name: "洗面・衛生",  items: ["シャンプー・リンス・ボディソープ","歯ブラシ・歯磨き粉","タオルハンカチ","バスタオル","速乾タオル（SUP後用）","髭剃り","塗り薬（常備薬）","飲み薬（常備薬）","のど飴","鼻呼吸テープ","汗拭きシート"] },
  { id: "electronics", icon: "🔌", name: "電子機器",    items: ["スマホ","モバイルバッテリー・充電器類","カメラ","イヤホン","スマートウォッチ","Switch のリモコン"] },
  { id: "valuables",   icon: "💳", name: "貴重品・書類",items: ["財布","現金（多めに）","運転免許証","レンタカー予約確認書（画面 or 印刷）"] },
  { id: "bags",        icon: "🎒", name: "バッグ・小物",items: ["スーツケース（機内: 23×36×56cm以内・5kg以内）","少し大きめのカバン","ポーチ","防水ポーチ（スマホ・貴重品用）","防水バッグ（SUP用）","エコバッグ","折りたたみ傘","日傘","スリッパ"] },
  { id: "daily",       icon: "🧻", name: "生活用品",    items: ["ゴミ袋","ティッシュ","マスク","ジップロック"] },
  { id: "other",       icon: "☀️", name: "その他",      items: ["日焼け止め（ウォータープルーフ・SUP必須）","雨具（折りたたみ傘で対応可）"] },
];

const KEY = "hokkaido-packing-v2";
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36);
const mkItems = cat => cat.items.map(label => ({ id: uid(), label }));

function initData() {
  try { const r = localStorage.getItem(KEY); if (r) return JSON.parse(r); } catch {}
  const d = { items: {}, checks: {} };
  DEFAULTS.forEach(c => { d.items[c.id] = mkItems(c); });
  localStorage.setItem(KEY, JSON.stringify(d));
  return d;
}

let data = initData();
const save = () => localStorage.setItem(KEY, JSON.stringify(data));
const getItems = id => data.items[id] || [];

function updateProgress() {
  let total = 0, done = 0;
  DEFAULTS.forEach(c => getItems(c.id).forEach(it => { total++; if (data.checks[it.id]) done++; }));
  const pct = total ? Math.round(done / total * 100) : 0;
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("progressPct").textContent = pct + "%";
}

function updateBadge(catId) {
  const items = getItems(catId);
  const done = items.filter(it => data.checks[it.id]).length;
  const el = document.querySelector(`.cat-cnt[data-cat="${catId}"]`);
  if (!el) return;
  el.textContent = `${done}/${items.length}`;
  el.classList.toggle("done", items.length > 0 && done === items.length);
}

function toggleItem(id, li) {
  data.checks[id] = !data.checks[id];
  save();
  li.classList.toggle("checked", !!data.checks[id]);
  updateBadge(li.closest(".cat-block").dataset.cat);
  updateProgress();
}

function deleteItem(catId, id) {
  data.items[catId] = data.items[catId].filter(it => it.id !== id);
  delete data.checks[id];
  save();
  updateBadge(catId);
  updateProgress();
}

function mkItemEl(catId, item) {
  const li = document.createElement("li");
  li.className = "item" + (data.checks[item.id] ? " checked" : "");

  const chk = document.createElement("span");
  chk.className = "chk";
  chk.innerHTML = '<span class="chk-mark">✓</span>';

  const lbl = document.createElement("span");
  lbl.className = "item-lbl";
  lbl.textContent = item.label;

  const del = document.createElement("button");
  del.className = "del-btn";
  del.textContent = "×";
  del.setAttribute("aria-label", "削除");
  del.addEventListener("click", e => { e.stopPropagation(); li.remove(); deleteItem(catId, item.id); });

  li.append(chk, lbl, del);
  li.addEventListener("click", () => toggleItem(item.id, li));
  return li;
}

function mkAddInline(catId, list) {
  const wrap = document.createElement("div");
  wrap.className = "add-inline";
  const row = document.createElement("div");
  row.className = "add-wrap";

  const field = document.createElement("input");
  field.type = "text";
  field.className = "add-field";
  field.placeholder = "＋ 項目を追加...";
  field.maxLength = 60;

  const btn = document.createElement("button");
  btn.className = "add-submit";
  btn.textContent = "↑";
  btn.setAttribute("aria-label", "追加");

  const commit = () => {
    const label = field.value.trim();
    if (!label) return;
    const it = { id: uid(), label };
    data.items[catId].push(it);
    save();
    list.appendChild(mkItemEl(catId, it));
    updateBadge(catId);
    updateProgress();
    field.value = "";
    field.focus();
  };

  btn.addEventListener("click", commit);
  field.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); commit(); } });
  row.append(field, btn);
  wrap.appendChild(row);
  return wrap;
}

function buildPacking() {
  const main = document.getElementById("pack-main");
  main.innerHTML = "";
  DEFAULTS.forEach(cat => {
    const block = document.createElement("div");
    block.className = "cat-block";
    block.dataset.cat = cat.id;

    const hd = document.createElement("div");
    hd.className = "cat-hd";
    hd.style.cursor = "default";
    hd.innerHTML = `
      <span class="cat-icon">${cat.icon}</span>
      <span class="cat-name">${cat.name}</span>
      <span class="cat-rule"></span>
      <span class="cat-cnt" data-cat="${cat.id}">0/0</span>`;

    const list = document.createElement("ul");
    list.className = "item-list";
    getItems(cat.id).forEach(it => list.appendChild(mkItemEl(cat.id, it)));

    block.append(hd, list, mkAddInline(cat.id, list));
    main.appendChild(block);
    updateBadge(cat.id);
  });
  updateProgress();
}

document.getElementById("resetBtn").addEventListener("click", () => {
  if (!confirm("チェックをすべてリセットしますか？")) return;
  data.checks = {};
  save();
  document.querySelectorAll(".item.checked").forEach(el => el.classList.remove("checked"));
  DEFAULTS.forEach(c => updateBadge(c.id));
  updateProgress();
});

document.getElementById("restoreBtn").addEventListener("click", () => {
  if (!confirm("項目をデフォルトに戻しますか？\nチェック状態もリセットされます。")) return;
  data = { items: {}, checks: {} };
  DEFAULTS.forEach(cat => { data.items[cat.id] = mkItems(cat); });
  save();
  buildPacking();
});

/* ── Packing section toggle ── */
const packBody = document.getElementById("pack-body");
const packChev = document.getElementById("packChev");
let packOpen = localStorage.getItem("hokkaido-pack-open") === "1";

function applyPackState() {
  packBody.style.display = packOpen ? "block" : "none";
  packChev.style.transform = packOpen ? "rotate(0deg)" : "rotate(-90deg)";
}

applyPackState();

document.getElementById("packToggle").addEventListener("click", () => {
  packOpen = !packOpen;
  localStorage.setItem("hokkaido-pack-open", packOpen ? "1" : "0");
  applyPackState();
});

buildPacking();

</script>
